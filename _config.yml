title: V3RSec
description: "Manual do usuário do V3RSec — monitoramento de segurança e detecção de vazamento de dados, pela V3RTECH."
lang: pt-BR

# Domínio próprio (docs.v3rsec.v3rtech.com.br via CNAME) → servido na RAIZ, SEM baseurl.
# Com baseurl vazio, os assets/links do tema resolvem em https://docs.v3rsec.v3rtech.com.br/.
url: https://docs.v3rsec.v3rtech.com.br
baseurl: ""
permalink: pretty

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Tema / cor — design-system próprio do V3RSec (Projeto/docs/v3rsec-design-system.md).
# Ícone da marca, não a horizontal: o cabeçalho da barra lateral tem ~36px de
# altura, abaixo do mínimo em que a horizontal com slogan fica legível (§13.3).
# URL do bucket, não cópia local — é superfície externa (§14.1), e centraliza
# a atualização quando o logo trocar.
color_scheme: v3rsec
logo: "https://assets.v3rsec.v3rtech.com.br/v3rsec-logo-icone.svg"

# Busca
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true

# Callouts (admonitions)
callouts:
  note:
    title: Nota
    color: blue
  tip:
    title: Boas práticas
    color: green
  warning:
    title: Atenção
    color: yellow
  important:
    title: Importante
    color: red
  example:
    title: Exemplo
    color: purple

# Links auxiliares (canto superior direito)
aux_links:
  "V3RTECH":
    - "https://v3rtech.com.br"
aux_links_new_tab: true

# Rodapé
footer_content: '© 2026 <a href="https://v3rtech.com.br/" target="_blank" rel="noopener">V3RTECH</a>. Todos os direitos reservados. · <a href="/referencia/privacidade-e-termos/">Privacidade e Termos</a>'
last_edit_timestamp: false
back_to_top: true
back_to_top_text: "Voltar ao topo"

# Excluir do build
exclude:
  - "*.sh"
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - assets/README-screenshots.md
